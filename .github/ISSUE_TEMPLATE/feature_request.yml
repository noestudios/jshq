name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that jshq makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about or worked around.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Fit with the project
      options:
        - label: "This keeps jshq local-first and zero-tracking (no telemetry, no required cloud services)."
          required: false
