<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Job Search HQ</title>
    <meta
      name="description"
      content="A local-first job-search dashboard: postings pulled automatically, screened against location, comp, and level, then scored against criteria you write yourself."
    />

    <!-- No share-card (og:/twitter:) metadata. It existed for one hosted demo
         linked from social, and its absolute URLs were the only ones in the
         bundle — a deploy host baked into markup that every install serves.
         This app runs on 127.0.0.1; nothing crawls a loopback address. -->

    <!-- Regenerate the raster pair from the SVG with scripts/make_favicon.py. -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#121518" />
    <!-- Theme boot: must stay ABOVE the stylesheet links so a stored light
         preference never flashes dark. Mirrors js/lib/theme.js (which owns
         runtime switching) and MUST be changed with it; the hexes mirror
         --t-bg-elev per theme and theme.js re-syncs the meta from computed
         style after CSS loads.

         Absent preference = DARK, not the OS setting. Dark is the primary
         design theme and the toggle is buried in Settings, so tracking the OS
         put most first-time visitors to the public demo on a light theme they
         never chose. The OS is still followed, but only when it is asked for
         explicitly — which is why "system" is a STORED value here rather than
         the absence of one. -->
    <script>
      (() => {
        let t = null;
        try { t = localStorage.getItem("hq_theme"); } catch {}
        if (t === "system")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        else if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content =
          t === "light" ? "#f3f6f9" : "#121518";
      })();
    </script>
    <!-- Self-hosted (Phase 1, zero-phone-home): faces + weight/ital ranges are
         explained in css/fonts.css, licenses in fonts/OFL-*.txt.

         Fraunces is gone as of the logotype swap. --t-font-display had exactly one
         consumer in the whole app (.brand-mark), and the wordmark is outlined SVG
         now, so the family was two faces of dead payload plus a render-blocking
         round trip. Nothing renders a serif; do not re-add it without one. -->
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Skip link (A11Y): first tab stop, visually hidden until focused, so a
         keyboard user can jump past the nav straight into the view. href is a
         no-slash "#view" that the hash router (which matches "#/route") ignores,
         and app.js preventDefaults it and focuses #view directly — so it never
         pollutes the route. -->
    <a class="skip-link" href="#view">Skip to main content</a>

            <!-- The wordmark, outlined. Source of truth is docs/brand/jshq-logotype.svg
                 (the owner's Illustrator export, committed unmodified). This is that file with
                 the <defs><style> stripped and two substitutions applied: .st1 ->
                 currentColor on the svg root, .st0 -> var(--t-accent) via .brand-hq in
                 app.css. Edit the artwork THERE, not here.

                 Inline rather than <img> because only inline SVG can read the theme
                 tokens: one file serves both themes with no swap logic and no boot flash.
                 The fill is split across an attribute AND css because var() is not
                 supported in SVG presentation attributes (Chrome and Firefox drop it
                 silently) while currentColor is. The root fill also means this degrades
                 to a legible monochrome wordmark if app.css never arrives.

                 A light export exists and is deliberately NOT committed: same artwork,
                 re-exported, so its path data differs by node count and cannot be diffed
                 against this one. It is redundant -- the two colours it carried are
                 exactly --t-ink and --t-accent in the light block.

                 The href is #/today rather than "/" so it never leaves the app: a
                 root-relative href would escape the demo bundle when it is deployed
                 under a subpath, and this avoids a full reload. -->
